name: Build Docker images

on:
    push:
        branches: ["main"]

jobs:
    build-and-push-dockerfile-image:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v3

            - name: Log in to Docker Hub
              uses: docker/login-action@v2
              with:
                  registry: cr.yandex
                  username: ${{ secrets.YANDEX_USERNAME }}
                  password: ${{ secrets.YANDEX_TOKEN }}

            - name: Build and push Docker image
              uses: docker/build-push-action@v4
              with:
                  context: .
                  file: ./Dockerfile
                  push: true
                  tags: |
                      cr.yandex/crps3cqv4rgnku2mtmdf/parus-frontend:latest
                  platforms: linux/amd64
                  build-args: |
                      NEXT_PUBLIC_DEFAULT_REGION=ru
                      DATABASE_URL=${{ secrets.DATABASE_URL }}
                      NEXT_PUBLIC_BASE_URL=${{ secrets.NEXT_PUBLIC_BASE_URL }}
                      REVALIDATE_SECRET=${{ secrets.REVALIDATE_SECRET }}

            - name: Call API after Docker push
              run: curl "${{ secrets.DEPLOY_URL }}"
