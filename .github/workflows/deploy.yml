name: Build Docker images

on:
    push:
        branches: ["main"]

jobs:
    build-and-push-dockerfile-image:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v3

            - name: Log in to Docker Hub
              uses: docker/login-action@v2
              with:
                  registry: cr.yandex
                  username: ${{ secrets.YANDEX_USERNAME }} # Make sure to add the secrets in your repository in -> Settings -> Secrets (Actions) -> New repository secret
                  password: ${{ secrets.YANDEX_TOKEN }} # Make sure to add the secrets in your repository in -> Settings -> Secrets (Actions) -> New repository secret

            - name: Build and push Docker image
              uses: docker/build-push-action@v4
              with:
                  context: .
                  file: ./Dockerfile
                  push: true
                  # Make sure to replace with your own namespace and repository
                  tags: |
                      cr.yandex/crps3cqv4rgnku2mtmdf/parus-frontend:latest
                  platforms: linux/amd64
                  build-args: |
                      NEXT_PUBLIC_DEFAULT_REGION=ru
                      MEDUSA_BACKEND_URL=${{ secrets.MEDUSA_BACKEND_URL }}
                      NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY }}
                      NEXT_PUBLIC_BASE_URL=${{ secrets.NEXT_PUBLIC_BASE_URL }}
                      REVALIDATE_SECRET=${{ secrets.REVALIDATE_SECRET }}
